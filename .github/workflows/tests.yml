name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: Tests without Workbench or external data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q -m 'not workbench' -rs
  workbench:
    name: Workbench and downloaded Schaefer integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y connectome-workbench
      - run: /usr/bin/wb_command -version
      - name: Download references and Schaefer test inputs (no TemplateFlow atlases)
        run: python prepare_demo.py --profile test
      - name: Run real conversions; optional TemplateFlow cases report skips
        env:
          ATLAS_RESCUE_WB: /usr/bin/wb_command
        run: python -m pytest -q -m workbench -rs
